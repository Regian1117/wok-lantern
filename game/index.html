<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wok &amp; Lantern — Night Market Kitchen</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120806;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #gl {
        z-index: 1;
      }
      #hud {
        z-index: 2;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="gl"></canvas>
      <canvas id="hud"></canvas>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
